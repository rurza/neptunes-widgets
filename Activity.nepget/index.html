<!DOCTYPE html>
<html lang="en" class="theme-auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Activity</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Carries the card's drop shadow. Empty and inert on purpose — see styles.css. -->
    <div class="panel-shadow" id="panelShadow" aria-hidden="true"></div>

    <div class="card" id="widget">
        <div class="grid" id="grid" role="img"></div>
        <div class="status" id="status" role="status" aria-live="polite" hidden></div>
        <!-- Inside the card so it never widens the host's hover region (body's children). -->
        <div class="callout" id="callout" aria-hidden="true" hidden>
            <div class="callout-count" id="calloutCount"></div>
            <div class="callout-date" id="calloutDate"></div>
        </div>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <script src="neptunes-kit.js"></script>
    <script src="script.js"></script>
</body>
</html>
