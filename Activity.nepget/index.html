<!DOCTYPE html>
<html lang="en" class="theme-auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Activity</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card nt-card" id="widget">
        <div class="grid" id="grid" role="img"></div>
        <div class="status" id="status" role="status" aria-live="polite" hidden></div>
        <!-- Hover grip along the corner: the handle below is the hit target. See styles.css. -->
        <svg class="resize-grip" viewBox="0 0 1.52866 1.52866" aria-hidden="true"><path d="M1.51935 0.52401 C1.51 0.66403 1.49128 0.77848 1.45375 0.89717 C1.3596 1.15584 1.15584 1.3596 0.89717 1.45375 C0.77848 1.49128 0.66403 1.51 0.52401 1.51935"/></svg>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <!-- Outside the card: NepTunes clips .nt-card to the system corner, and a callout at the
         grid's edge reaches past the card into the gutter. Hidden (display: none) whenever the
         pointer is off the grid, so it does not widen the host's hover region (body's children). -->
    <div class="callout" id="callout" aria-hidden="true" hidden>
        <div class="callout-count" id="calloutCount"></div>
        <div class="callout-date" id="calloutDate"></div>
    </div>

    <script src="neptunes-kit.js"></script>
    <script src="script.js"></script>
</body>
</html>
