<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="widget nt-card empty" id="widget">
        <div class="artwork-bg" id="artworkBg"></div>
        <div class="no-artwork" id="noArtwork">
            <img class="sf-icon" data-symbol="music.note" data-size="36" alt="">
        </div>
        <!-- Nothing playing: an empty sleeve in the theme's own ink, over the placeholder. -->
        <div class="empty-art" aria-hidden="true">
            <img class="sf-icon" data-symbol="music.note" data-size="56" alt="">
        </div>
        <div class="controls-area">
            <!-- Blurred copy of the cover; the frost. See styles.css for why this is not
                 a backdrop-filter. -->
            <div class="controls-frost" id="controlsFrost" aria-hidden="true"></div>
            <div class="info">
                <div class="title" id="title">Nothing playing</div>
                <div class="artist" id="artist"></div>
            </div>
            <div class="controls">
                <button class="control-btn" id="prevBtn">
                    <img class="sf-icon" data-symbol="backward.end.fill" data-size="18" alt="">
                </button>
                <button class="control-btn play-pause" id="playPauseBtn" aria-label="Play">
                    <img class="sf-icon play-icon" data-symbol="play.fill" data-size="22" alt="">
                    <img class="sf-icon pause-icon" data-symbol="pause.fill" data-size="22" alt="">
                    <img class="sf-icon stop-icon" data-symbol="stop.fill" data-size="22" alt="">
                </button>
                <button class="control-btn" id="nextBtn">
                    <img class="sf-icon" data-symbol="forward.end.fill" data-size="18" alt="">
                </button>
                <span class="live-badge" id="liveBadge" hidden>LIVE</span>
            </div>
            <!-- Nothing playing: takes the transport row's place while there is no track.
                 A real <button>, so the host's drag script leaves the click alone. -->
            <button class="empty-open" id="emptyOpen" type="button" data-action="activate-player"
                    aria-label="Nothing playing. Open music player">
                <img class="sf-icon" data-symbol="play.fill" data-size="12" alt="">
                <span>Open music player</span>
            </button>
        </div>
        <!-- Hover grip along the corner: the handle below is the hit target. See styles.css. -->
        <svg class="resize-grip" viewBox="-0.5 -0.5 2.52866 2.52866" aria-hidden="true"><path d="M1.51935 0.52401 C1.51 0.66403 1.49128 0.77848 1.45375 0.89717 C1.3596 1.15584 1.15584 1.3596 0.89717 1.45375 C0.77848 1.49128 0.66403 1.51 0.52401 1.51935"/></svg>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>
    <script src="sfsymbols.js"></script>
    <script src="script.js"></script>
</body>
</html>
