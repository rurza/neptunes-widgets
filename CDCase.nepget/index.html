<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CD Case</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The whole widget is one GL canvas. There is no card and no drop shadow:
     the case casts its own contact shadow inside the render, so the usual
     gutter arithmetic does not apply here. -->
<canvas id="gl"></canvas>

<!-- Nothing playing: shown whenever there is no track. The case itself wears an empty
     sleeve that says so (script.js); this is the one thing to do about it. A real
     <button>, so the host's drag script leaves the click alone — the case around it
     still drags the window. -->
<div id="empty" hidden>
  <button id="emptyOpen" type="button" data-action="activate-player"
          aria-label="Nothing playing. Open music player">
    <svg viewBox="0 0 10 12" width="8" height="10" aria-hidden="true"><path d="M1 1.2v9.6c0 .6.6.9 1.1.6l7.3-4.8c.4-.3.4-.9 0-1.2L2.1.6C1.6.3 1 .6 1 1.2z"/></svg>
    <span id="emptyText">Open music player</span>
  </button>
</div>

<!-- The host gives a widget no console and no Web Inspector, so failures have
     to surface in the widget itself or they are invisible. -->
<div id="err" hidden></div>

<script src="three.js"></script>
<script src="models.js"></script>
<script src="script.js"></script>
</body>
</html>
