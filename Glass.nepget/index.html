<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Carries the panel's drop shadow. Empty and inert on purpose — see styles.css. -->
    <div class="panel-shadow" aria-hidden="true"></div>

    <div class="widget stopped" id="widget">
        <!-- Full-bleed album cover -->
        <img class="artwork" id="artwork" alt="">

        <!-- Placeholder shown when there is no artwork -->
        <div class="no-artwork" id="noArtwork">
            <!-- data-size must equal the CSS box in styles.css, or the PNG is resampled. -->
            <img class="sf-icon" data-symbol="music.note" data-size="80" alt="">
        </div>

        <!-- Frosted-glass control panel over the lower portion. `panel-always` is the default
             Controls mode; script.js drops it for "On hover", and then the whole sheet is what
             the pointer reveals. -->
        <div class="panel panel-always" id="panel">
            <div class="info">
                <div class="title" id="title">Not Playing</div>
                <div class="artist" id="artist"></div>
            </div>

            <div class="controls" id="controls">
                <button class="control-btn" id="prevBtn" type="button" title="Previous" aria-label="Previous">
                    <img class="sf-icon" data-symbol="backward.end.fill" data-size="20" alt="">
                </button>
                <button class="control-btn play-btn" id="playBtn" type="button" title="Play/Pause" aria-label="Play/Pause">
                    <img class="sf-icon play-icon" data-symbol="play.fill" data-size="22" alt="">
                    <img class="sf-icon pause-icon" data-symbol="pause.fill" data-size="22" alt="">
                    <img class="sf-icon stop-icon" data-symbol="stop.fill" data-size="22" alt="">
                </button>
                <button class="control-btn" id="nextBtn" type="button" title="Next" aria-label="Next">
                    <img class="sf-icon" data-symbol="forward.end.fill" data-size="20" alt="">
                </button>
                <span class="live-badge" id="liveBadge" hidden>LIVE</span>
            </div>
        </div>
    </div>

    <script src="neptunes-kit.js"></script>
    <script src="sfsymbols.js"></script>
    <script src="script.js"></script>
</body>
</html>
