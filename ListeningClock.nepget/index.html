<!DOCTYPE html>
<html lang="en" class="theme-auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card nt-card" id="widget">
        <svg class="face" id="face" role="img" xmlns="http://www.w3.org/2000/svg">
            <g id="tracks"></g>
            <g id="bars"></g>
            <circle id="disc"></circle>
            <g id="labels" aria-hidden="true"></g>
        </svg>
        <div class="center" id="center" aria-hidden="true"></div>
        <div class="caption" id="caption"></div>
        <div class="status" id="status" role="status" aria-live="polite" hidden></div>
        <!-- Hover grip along the corner: the handle below is the hit target. See styles.css. -->
        <svg class="resize-grip" viewBox="0 0 1.52866 1.52866" aria-hidden="true"><path d="M1.51935 0.52401 C1.51 0.66403 1.49128 0.77848 1.45375 0.89717 C1.3596 1.15584 1.15584 1.3596 0.89717 1.45375 C0.77848 1.49128 0.66403 1.51 0.52401 1.51935"/></svg>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <script src="neptunes-kit.js"></script>
    <script src="history-stats.js"></script>
    <script src="script.js"></script>
</body>
</html>
