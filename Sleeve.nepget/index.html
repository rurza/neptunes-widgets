<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeve</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sleeve: a floating album cover on the LEFT with the track set beside it
         on the RIGHT, straight on the wallpaper. No background card, no controls. -->
    <div class="widget stopped" id="widget">
        <!-- The cover is the ONLY shadowed element. -->
        <div class="cover" id="cover">
            <img class="art" id="art" src="" alt="Album artwork">
            <div class="no-art" id="noArt" aria-hidden="true">
                <img class="sf-icon" data-symbol="music.note" data-size="40" alt="">
            </div>
        </div>

        <!-- Track text, left-aligned, vertically centered beside the cover. -->
        <div class="info" id="info">
            <div class="title" id="title">Nothing playing</div>
            <div class="album" id="album"></div>
            <div class="artist" id="artist"></div>
        </div>

        <!-- Nothing playing: set where the track text goes, and opens the music player.
             A real <button>, so the host's drag script leaves the click alone. -->
        <button class="empty-open" id="emptyOpen" type="button" data-action="activate-player"
                aria-label="Nothing playing. Open music player">
            <span class="empty-title">Nothing playing</span>
            <span class="empty-hint">Open music player</span>
        </button>
    </div>

    <script src="neptunes-kit.js"></script>
    <script src="sfsymbols.js"></script>
    <script src="script.js"></script>
</body>
</html>
