<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="widget" id="widget">
        <div class="stack">
            <!-- The only shadowed element: rounded album cover -->
            <div class="cover" id="cover">
                <img id="artwork" src="" alt="Album artwork">
                <div class="no-artwork" id="noArtwork">
                    <img class="sf-icon" data-symbol="music.note" data-size="36" alt="">
                </div>
            </div>

            <!-- Transport: prev / play-pause / next -->
            <div class="controls controls-always" id="controls">
                <button class="control-btn glyph" id="prevBtn" title="Previous" aria-label="Previous">
                    <img class="sf-icon" data-symbol="backward.end.fill" data-size="18" alt="">
                </button>
                <button class="control-btn play-btn" id="playBtn" title="Play/Pause" aria-label="Play/Pause">
                    <img class="sf-icon play-icon" data-symbol="play.fill" data-size="22" alt="">
                    <img class="sf-icon pause-icon" data-symbol="pause.fill" data-size="22" alt="">
                </button>
                <button class="control-btn glyph" id="nextBtn" title="Next" aria-label="Next">
                    <img class="sf-icon" data-symbol="forward.end.fill" data-size="18" alt="">
                </button>
            </div>

            <!-- Title + artist, stacked below the controls -->
            <div class="title" id="title">Not Playing</div>
            <div class="artist" id="artist"></div>
        </div>
    </div>

    <script src="neptunes-kit.js"></script>
    <script src="sfsymbols.js"></script>
    <script src="script.js"></script>
</body>
</html>
