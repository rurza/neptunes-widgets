<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Layer order mirrors V1's ZStack: artwork, then the info strip, then the hover
         panel on top of both (HoverView was layered over ArtworkView, not swapped for it). -->
    <div class="widget nt-card" id="widget">
        <img class="cover" id="cover" alt="">

        <div class="nocover" id="nocover">
            <img class="sf-icon" data-symbol="music.note" data-size="120" alt="">
        </div>

        <!-- Motion artwork: script.js puts one muted, looping <video> per album loop in here,
             over the static cover (and the no-cover field) and under the info strip. -->
        <div class="motion-layer" id="motionLayer" aria-hidden="true"></div>

        <div class="info-bar" id="infoBar">
            <!-- Pre-blurred copy of the cover. Not a backdrop-filter; see styles.css. -->
            <div class="frost" id="infoFrost" aria-hidden="true"></div>
            <div class="info-stack">
                <div class="title" id="title"></div>
                <div class="artist" id="artist"></div>
            </div>
        </div>

        <div class="hover" id="hoverLayer">
            <div class="frost" id="hoverFrost" aria-hidden="true"></div>
            <div class="hover-rows">
                <div class="row row-secondary">
                    <button type="button" class="control-btn" id="shuffleBtn" aria-label="Shuffle">
                        <img class="sf-icon" data-symbol="shuffle" data-size="35" alt="">
                    </button>
                    <button type="button" class="control-btn" id="repeatBtn" aria-label="Repeat">
                        <img class="sf-icon" id="repeatIcon" data-symbol="repeat" data-size="35" data-shown="repeat" alt="">
                    </button>
                    <!-- Exactly one of these two is shown; the script hides the other. -->
                    <button type="button" class="control-btn" id="loveBtn" aria-label="Love">
                        <img class="sf-icon" id="loveIcon" data-symbol="heart" data-size="33" data-shown="heart" alt="">
                    </button>
                    <button type="button" class="control-btn" id="volumeBtn" aria-label="Volume">
                        <img class="sf-icon" id="volumeIcon" data-symbol="speaker.wave.2" data-size="43" data-shown="speaker.wave.2" alt="">
                    </button>
                </div>
                <div class="row row-transport">
                    <button type="button" class="control-btn" id="prevBtn" aria-label="Previous track">
                        <img class="sf-icon" data-symbol="backward.end.fill" data-size="30" alt="">
                    </button>
                    <button type="button" class="control-btn" id="playBtn" aria-label="Play or pause">
                        <img class="sf-icon play-icon" data-symbol="play.fill" data-size="27" alt="">
                        <img class="sf-icon pause-icon" data-symbol="pause.fill" data-size="26" alt="">
                        <img class="sf-icon stop-icon" data-symbol="stop.fill" data-size="28" alt="">
                    </button>
                    <span class="live-badge" id="liveBadge" hidden>LIVE</span>
                    <button type="button" class="control-btn" id="nextBtn" aria-label="Next track">
                        <img class="sf-icon" data-symbol="forward.end.fill" data-size="30" alt="">
                    </button>
                </div>
                <!-- Nothing playing: the only thing left to do is open the music player. -->
                <div class="row row-empty">
                    <button type="button" class="control-btn on empty-open" id="emptyOpen"
                            data-action="activate-player" aria-label="Nothing playing. Open music player">
                        <img class="sf-icon" data-symbol="play.fill" data-size="26" alt="">
                    </button>
                    <span class="empty-hint">Open player</span>
                </div>
            </div>
        </div>

        <!-- Hover grip along the corner: the handle below is the hit target. See styles.css. -->
        <svg class="resize-grip" viewBox="0 0 1.52866 1.52866" aria-hidden="true"><path d="M1.51935 0.52401 C1.51 0.66403 1.49128 0.77848 1.45375 0.89717 C1.3596 1.15584 1.15584 1.3596 0.89717 1.45375 C0.77848 1.49128 0.66403 1.51 0.52401 1.51935"/></svg>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <!-- Outside the card, like V1's NSPopover outside its window: the card's corner clip must
         never cut it. Positioned against body, which the host makes the containing block. -->
    <div class="volume-popover" id="volumePopover">
        <!-- Pre-blurred copy of the cover, lined up with the card. Not a backdrop-filter. -->
        <div class="frost" id="popoverFrost" aria-hidden="true"></div>
        <input type="range" class="slider" id="volumeSlider" min="0" max="100" step="1" aria-label="Volume">
    </div>

    <script src="sfsymbols.js"></script>
    <script src="script.js"></script>
</body>
</html>
