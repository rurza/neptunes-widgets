<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="widget empty" id="widget" data-nt-hover-region="content-box">
        <div class="vinyl-row">
            <div class="side left" id="leftSide"></div>
            <div class="vinyl-shadow" data-nt-hit-region="ellipse">
                <div class="vinyl" id="vinyl">
                    <div class="grooves"></div>
                    <div class="label" id="label">
                        <img id="artwork" src="" alt="">
                        <div class="label-center"></div>
                    </div>
                </div>
                <!-- Nothing playing: a play mark on the stopped record's label that opens the
                     music player. Outside .vinyl, which turns, so the mark stays upright.
                     A real <button>, so the host's drag script leaves the click alone; the
                     rest of the disc still drags the window. -->
                <button class="empty-open" id="emptyOpen" type="button" data-action="activate-player"
                        aria-label="Nothing playing. Open music player">
                    <img class="sf-icon" data-symbol="play.fill" data-size="18" alt="">
                </button>
            </div>
            <div class="side right" id="rightSide"></div>
        </div>
        <div class="bottom-row" id="bottomSide"></div>
        <!-- The content-corner grip stays separate from the record and panels: hover-only
             space remains desktop-pass-through, while this painted target owns resize input. -->
        <div class="resize-handle" id="resizeHandle" data-nt-hit-region="rect" data-nt-hover-region="content-box" aria-hidden="true">
            <svg class="resize-grip" viewBox="0 0 20 20" aria-hidden="true">
                <path d="M14.5 4.5 C14.5 9.8 9.8 14.5 4.5 14.5"/>
            </svg>
        </div>
    </div>

    <template id="trackInfoTemplate">
        <div class="track-info" id="trackInfo">
            <div class="title" id="title" data-nt-hit-region="text"></div>
            <div class="artist" id="artist" data-nt-hit-region="text"></div>
        </div>
    </template>

    <template id="controlsTemplate">
        <div class="controls" id="controls">
            <button class="control-btn" id="prevBtn" data-nt-hit-region="rect">
                <img class="sf-icon" data-symbol="backward.end.fill" data-size="18" alt="">
            </button>
            <button class="control-btn play-btn" id="playBtn" data-nt-hit-region="rect">
                <img class="sf-icon play-icon" data-symbol="play.fill" data-size="24" alt="">
                <img class="sf-icon pause-icon" data-symbol="pause.fill" data-size="24" alt="">
                <img class="sf-icon stop-icon" data-symbol="stop.fill" data-size="24" alt="">
            </button>
            <button class="control-btn" id="nextBtn" data-nt-hit-region="rect">
                <img class="sf-icon" data-symbol="forward.end.fill" data-size="18" alt="">
            </button>
            <span class="live-badge" id="liveBadge" data-nt-hit-region="text" hidden>LIVE</span>
        </div>
    </template>

    <script src="sfsymbols.js"></script>
    <script src="script.js"></script>
</body>
</html>
